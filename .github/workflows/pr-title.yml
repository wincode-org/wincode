name: PR title

# The title becomes the squash commit message and feeds release-please, so it must be a Conventional Commit (CONTRIBUTING.md).
# Plain `pull_request` and no third-party action: nothing from the pull request is checked out, there is no token, and the title
# reaches the script only through the environment.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  semantic-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([A-Za-z0-9][A-Za-z0-9._/, -]*\))?!?: [^ ].*$'
          if [[ $PR_TITLE =~ $re ]]; then
            echo "The title follows Conventional Commits."
          else
            # The title is not echoed: it is untrusted text, and a line that starts with :: would be a workflow command.
            echo "::error title=PR title::The title must look like 'type(scope): summary' (the scope is optional, and '!' after it marks a breaking change). Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            exit 1
          fi
