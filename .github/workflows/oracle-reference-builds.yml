name: oracle-reference-builds

# Reference data from real Xcode for the zero-rejection checks and the Assets.car track
# (docs/PLAN.md): the spike counter app and the spike E hooks app built by Xcode, text dumps of
# both bundles, and placeholder assets compiled by actool: an app icon (docs/formats/assets-car-app-icon.md),
# and the colour set and image set that a UILaunchScreen entry names (ADR-0011, rule 3). The last steps save the `actool`
# command lines that Xcode itself passes for an app's catalog and for a Swift package's resource bundle (ADR-0016, step 0).
# Outputs only: no signing, no Apple account, no secrets. Compare with the Windows-built bundles
# using tools/ipa-diff. Manual only: gh workflow run oracle-reference-builds.yml --ref <branch>

# Public repositories: anyone who can read one can download its artifacts, and these workflows produce output of Apple tools (Xcode, actool,
# gen_snapshot) that must not be public. So every upload step runs only while the repository is private
# (github.event.repository.private == true) and keeps its files for 1 day. In a public repository the job still runs but uploads
# nothing: run it from a private repository to keep the files. workflow_dispatch only, so no pull request or push can start it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    # macOS minutes are the scarce resource: this job never runs for a pull request, whoever opens it.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      FLUTTER_TAG: "3.47.7"
      XCODE_APP: /Applications/Xcode_26.6.app   # the Xcode version winCode's Darwin SDK comes from
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode, print versions
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version | grep -qx "Xcode 26.6" || { echo "expected Xcode 26.6, got: $(xcodebuild -version | head -1)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dumps"
          { sw_vers; uname -m; xcodebuild -version; echo "iphoneos SDK $(xcrun --sdk iphoneos --show-sdk-version)"; xcrun actool --version; } \
            | tee "$RUNNER_TEMP/dumps/versions.txt"

      - name: Flutter
        run: |
          git clone -q --depth 1 --branch "$FLUTTER_TAG" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version | tee -a "$RUNNER_TEMP/dumps/versions.txt"
          "$RUNNER_TEMP/flutter/bin/flutter" precache --ios

      - name: Test apps (spike E's make_apps.sh, the same sources the Windows build uses)
        run: SPIKE_E="$RUNNER_TEMP/apps" FLUTTER_ROOT="$RUNNER_TEMP/flutter" bash spikes/e-native-build-hooks/make_apps.sh

      - name: flutter build ios --no-codesign
        run: |
          for app in counter hooks_app; do
            (cd "$RUNNER_TEMP/apps/$app" && flutter build ios --release --no-codesign -v >"$RUNNER_TEMP/dumps/build-$app.log" 2>&1) \
              || { tail -60 "$RUNNER_TEMP/dumps/build-$app.log"; exit 1; }
            mkdir -p "$RUNNER_TEMP/app-$app"
            cp -R "$RUNNER_TEMP/apps/$app/build/ios/iphoneos/Runner.app" "$RUNNER_TEMP/app-$app/"
          done

      - name: Dumps (Info.plist, otool -l, entitlements, file listing)
        run: |
          for app in counter hooks_app; do
            A="$RUNNER_TEMP/app-$app/Runner.app"; D="$RUNNER_TEMP/dumps/$app"; mkdir -p "$D"
            (cd "$A" && find . \( -type f -o -type l \) -exec stat -f '%z %Sp %N' {} + | sort -k3) >"$D/files.txt"
            find "$A" -name Info.plist | sort | while read -r p; do
              echo "== ${p#"$A"/}"; plutil -convert xml1 -o - "$p"
            done >"$D/info-plists.txt"
            find "$A" -type f | sort | while read -r f; do
              if file -b "$f" | grep -q Mach-O; then echo "== ${f#"$A"/}: $(file -b "$f")"; otool -l "$f"; fi
            done >"$D/otool-l.txt"
            for b in "$A" "$A"/Frameworks/*.framework; do
              echo "== ${b#"$RUNNER_TEMP/app-$app"/}"; codesign -d --entitlements - --xml "$b" 2>&1 || true; echo
            done >"$D/codesign-entitlements.txt"
          done
          grep -h "/actool " "$RUNNER_TEMP"/dumps/build-*.log >"$RUNNER_TEMP/dumps/xcode-actool-invocations.txt" || true

      - name: Icon sample (placeholder icon, launch colour and launch image, compiled by actool)
        run: |
          S="$RUNNER_TEMP/icon-sample"; C="$S/Sample.xcassets"; O="$S/compiled"
          mkdir -p "$C/AppIcon.appiconset" "$C/LaunchBackground.colorset" "$C/LaunchImage.imageset" "$O"
          printf '{"info":{"author":"xcode","version":1}}\n' >"$C/Contents.json"
          printf '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}\n' \
            >"$C/AppIcon.appiconset/Contents.json"
          # The colour set and the image set that UILaunchScreen names (UILaunchScreen.plist, below).
          printf '{"colors":[{"color":{"color-space":"srgb","components":{"alpha":"1.000","blue":"0.600","green":"0.400","red":"0.200"}},"idiom":"universal"}],"info":{"author":"xcode","version":1}}\n' \
            >"$C/LaunchBackground.colorset/Contents.json"
          printf '{"images":[{"filename":"launch@1x.png","idiom":"universal","scale":"1x"},{"filename":"launch@2x.png","idiom":"universal","scale":"2x"},{"filename":"launch@3x.png","idiom":"universal","scale":"3x"}],"info":{"author":"xcode","version":1}}\n' \
            >"$C/LaunchImage.imageset/Contents.json"
          python3 - "$C/AppIcon.appiconset" "$C/LaunchImage.imageset" <<'PY'
          # Placeholders, no art, no text: the icon is a plain 1024x1024 RGB gradient with no alpha; the launch
          # image is one plain colour at 64, 128 and 192 px (1x, 2x, 3x), RGBA with alpha rising from left to right.
          import struct, sys, zlib
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data))
          def png(path, n, colour_type, rows):
              open(path, "wb").write(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", n, n, 8, colour_type, 0, 0, 0))
                                     + chunk(b"IDAT", zlib.compress(rows, 9)) + chunk(b"IEND", b""))
          n = 1024
          png(f"{sys.argv[1]}/icon-1024.png", n, 2,
              b"".join(b"\0" + bytes(v for x in range(n) for v in (x // 4, y // 4, 128)) for y in range(n)))
          for scale in (1, 2, 3):
              n = 64 * scale
              png(f"{sys.argv[2]}/launch@{scale}x.png", n, 6,
                  b"".join(b"\0" + bytes(v for x in range(n) for v in (32, 96, 160, 255 * x // (n - 1))) for y in range(n)))
          PY
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>UILaunchScreen</key><dict>' \
            '<key>UIColorName</key><string>LaunchBackground</string><key>UIImageName</key><string>LaunchImage</string>' \
            '</dict></dict></plist>' >"$S/UILaunchScreen.plist"
          plutil -lint "$S/UILaunchScreen.plist"
          cmd=(xcrun actool "$C" --compile "$O" --platform iphoneos --minimum-deployment-target 15.0
               --target-device iphone --target-device ipad --app-icon AppIcon
               --output-partial-info-plist "$O/partial-Info.plist"
               --output-format human-readable-text --notices --warnings --errors)
          printf '%q ' "${cmd[@]}" >"$S/actool-command.txt"; echo >>"$S/actool-command.txt"
          "${cmd[@]}" >"$S/actool-output.txt" 2>&1
          xcrun assetutil --info "$O/Assets.car" >"$S/assetutil-info.json"
          (cd "$O" && find . -type f -exec stat -f '%z %N' {} + | sort -k2) >"$S/compiled-files.txt"

      # Step 0 of ADR-0016 (docs/adr/0016-asset-catalog-cloud-job.md): save the `actool` command lines that Xcode itself passes
      # for an app's catalog (the two builds above) and for the resource bundle of a Swift package (the two probes below).
      # Observation only: the lines and the catalogs they made go to `dumps/capture/` (artifact `xcode-dumps`), and the recipe
      # is written from them afterwards. Each probe is its own step and may fail without stopping the other; the last step
      # of the group fails the job when a probe left no actool line, so an empty capture is never green. `timeout-minutes`
      # on each step keeps a hang from using the whole job's 30 minutes.
      - name: Probe catalog (one image set, a plain generated PNG)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/probe-catalog/Assets.xcassets"; mkdir -p "$C/ProbeImage.imageset"
          printf '{"info":{"author":"xcode","version":1}}\n' >"$C/Contents.json"
          printf '{"images":[{"filename":"probe@2x.png","idiom":"universal","scale":"2x"}],"info":{"author":"xcode","version":1}}\n' \
            >"$C/ProbeImage.imageset/Contents.json"
          python3 - "$C/ProbeImage.imageset/probe@2x.png" <<'PY'
          # A plain 8 x 8 RGBA image: no art, no text.
          import struct, sys, zlib
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data))
          rows = b"".join(b"\0" + bytes((32, 96, 160, 255)) * 8 for _ in range(8))
          open(sys.argv[1], "wb").write(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", 8, 8, 8, 6, 0, 0, 0))
                                        + chunk(b"IDAT", zlib.compress(rows, 9)) + chunk(b"IEND", b""))
          PY
          file "$C/ProbeImage.imageset/probe@2x.png"

      - name: Probe A, a Flutter plugin whose Swift package has one catalog, built into an app by Flutter
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/probe"; D="$RUNNER_TEMP/dumps/capture"; mkdir -p "$P" "$D"; cd "$P"
          flutter create --template=plugin --platforms=ios --org dev.wincode.spike probe_assets >/dev/null
          flutter create --org dev.wincode.spike --project-name probe_app --platforms ios probe_app >/dev/null
          S="probe_assets/ios/probe_assets"
          test -f "$S/Package.swift" || { echo "the plugin template made no Swift package:"; find probe_assets/ios | sort; exit 1; }
          cp -R "$RUNNER_TEMP/probe-catalog/Assets.xcassets" "$S/Sources/probe_assets/"
          perl -0pi -e 's/(resources:\s*\[)/$1\n                .process("Assets.xcassets"),/' "$S/Package.swift"
          grep -q '\.process("Assets.xcassets")' "$S/Package.swift" || { echo "no resources list in Package.swift:"; cat "$S/Package.swift"; exit 1; }
          cd probe_app
          flutter pub add probe_assets --path ../probe_assets
          flutter build ios --release --no-codesign -v >"$D/probe-plugin-build.log" 2>&1 \
            || { tail -60 "$D/probe-plugin-build.log"; exit 1; }

      - name: Probe B, a plain Swift package with one catalog, built for iOS by xcodebuild
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/probe-package"; D="$RUNNER_TEMP/dumps/capture"; mkdir -p "$P/Sources/ProbePackage" "$D"; cd "$P"
          cat >Package.swift <<'SWIFT'
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "ProbePackage",
              platforms: [.iOS(.v15)],
              products: [.library(name: "ProbePackage", targets: ["ProbePackage"])],
              targets: [.target(name: "ProbePackage", resources: [.process("Assets.xcassets")])]
          )
          SWIFT
          echo 'public let probe = 1' >Sources/ProbePackage/Probe.swift
          cp -R "$RUNNER_TEMP/probe-catalog/Assets.xcassets" Sources/ProbePackage/
          xcodebuild -scheme ProbePackage -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$P/dd" CODE_SIGNING_ALLOWED=NO build >"$D/probe-package-build.log" 2>&1 \
            || { tail -60 "$D/probe-package-build.log"; exit 1; }

      - name: Save the actool lines and the catalogs they made, and check that both probes left some
        if: always()
        run: |
          D="$RUNNER_TEMP/dumps/capture"; mkdir -p "$D"
          # Each line, with the two lines before it (Xcode's "CompileAssetCatalog ..." header and the "cd" line).
          for log in "$RUNNER_TEMP/dumps/build-counter.log" "$RUNNER_TEMP/dumps/build-hooks_app.log" "$D"/probe-*-build.log; do
            [ -f "$log" ] || continue
            n=$(basename "$log" .log)
            grep -n -B2 '/actool ' "$log" >"$D/$n.actool.txt" || true
            echo "$n: $(grep -c '/actool ' "$log" || true) lines with /actool"
          done | tee "$D/summary.txt"
          # Every Assets.car that these builds made: size, SHA-256 and `assetutil --info`.
          for root in "$RUNNER_TEMP/app-counter" "$RUNNER_TEMP/app-hooks_app" "$RUNNER_TEMP/probe/probe_app/build/ios/iphoneos" "$RUNNER_TEMP/probe-package/dd/Build/Products"; do
            [ -d "$root" ] || continue
            find "$root" -name Assets.car | sort | while read -r f; do
              rel="${f#"$RUNNER_TEMP"/}"; name=$(echo "$rel" | tr '/ ' '__')
              echo "$rel: $(stat -f '%z' "$f") bytes, sha256 $(shasum -a 256 "$f" | cut -d' ' -f1)"
              xcrun assetutil --info "$f" >"$D/assetutil-$name.json" 2>&1 || true
            done
          done | tee "$D/assets-car-files.txt"
          # A probe counts only when its own catalog was compiled (its package name is in the lines around the actool call).
          ok=0
          grep -q 'probe_assets' "$D/probe-plugin-build.actool.txt" 2>/dev/null || { echo "::error::probe A (plugin) left no actool line for probe_assets"; ok=1; }
          grep -q 'ProbePackage' "$D/probe-package-build.actool.txt" 2>/dev/null || { echo "::error::probe B (package) left no actool line for ProbePackage"; ok=1; }
          exit "$ok"

      - name: Upload counter Runner.app
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcode-counter-app
          path: ${{ runner.temp }}/app-counter/
          include-hidden-files: true   # flutter_assets holds dotfiles (.last_build_id)
          retention-days: 1

      - name: Upload hooks_app Runner.app
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcode-hooks_app-app
          path: ${{ runner.temp }}/app-hooks_app/
          include-hidden-files: true
          retention-days: 1

      - name: Upload dumps and build logs
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcode-dumps
          include-hidden-files: true
          path: ${{ runner.temp }}/dumps/
          retention-days: 1

      - name: Upload icon sample
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon-sample
          include-hidden-files: true
          path: ${{ runner.temp }}/icon-sample/
          retention-days: 1
