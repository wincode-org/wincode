name: oracle-reference-builds

# Reference data from real Xcode for the zero-rejection checks and the Assets.car track
# (docs/PLAN.md): the spike counter app and the spike E hooks app built by Xcode, text dumps of
# both bundles, and a placeholder app icon compiled by actool (docs/formats/assets-car-app-icon.md).
# Outputs only: no signing, no Apple account, no secrets. Compare with the Windows-built bundles
# using tools/ipa-diff. Manual only: gh workflow run oracle-reference-builds.yml --ref <branch>

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      FLUTTER_TAG: "3.47.7"
      XCODE_APP: /Applications/Xcode_26.6.app   # the Xcode version winCode's Darwin SDK comes from
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode, print versions
        run: |
          sudo xcode-select -s "$XCODE_APP"
          mkdir -p "$RUNNER_TEMP/dumps"
          { sw_vers; uname -m; xcodebuild -version; echo "iphoneos SDK $(xcrun --sdk iphoneos --show-sdk-version)"; xcrun actool --version; } \
            | tee "$RUNNER_TEMP/dumps/versions.txt"

      - name: Flutter
        run: |
          git clone -q --depth 1 --branch "$FLUTTER_TAG" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version | tee -a "$RUNNER_TEMP/dumps/versions.txt"
          "$RUNNER_TEMP/flutter/bin/flutter" precache --ios

      - name: Test apps (spike E's make_apps.sh, the same sources the Windows build uses)
        run: SPIKE_E="$RUNNER_TEMP/apps" FLUTTER_ROOT="$RUNNER_TEMP/flutter" bash spikes/e-native-build-hooks/make_apps.sh

      - name: flutter build ios --no-codesign
        run: |
          for app in counter hooks_app; do
            (cd "$RUNNER_TEMP/apps/$app" && flutter build ios --release --no-codesign -v >"$RUNNER_TEMP/dumps/build-$app.log" 2>&1) \
              || { tail -60 "$RUNNER_TEMP/dumps/build-$app.log"; exit 1; }
            mkdir -p "$RUNNER_TEMP/app-$app"
            cp -R "$RUNNER_TEMP/apps/$app/build/ios/iphoneos/Runner.app" "$RUNNER_TEMP/app-$app/"
          done

      - name: Dumps (Info.plist, otool -l, entitlements, file listing)
        run: |
          for app in counter hooks_app; do
            A="$RUNNER_TEMP/app-$app/Runner.app"; D="$RUNNER_TEMP/dumps/$app"; mkdir -p "$D"
            (cd "$A" && find . \( -type f -o -type l \) -exec stat -f '%z %Sp %N' {} + | sort -k3) >"$D/files.txt"
            find "$A" -name Info.plist | sort | while read -r p; do
              echo "== ${p#"$A"/}"; plutil -convert xml1 -o - "$p"
            done >"$D/info-plists.txt"
            find "$A" -type f | sort | while read -r f; do
              if file -b "$f" | grep -q Mach-O; then echo "== ${f#"$A"/}: $(file -b "$f")"; otool -l "$f"; fi
            done >"$D/otool-l.txt"
            for b in "$A" "$A"/Frameworks/*.framework; do
              echo "== ${b#"$RUNNER_TEMP/app-$app"/}"; codesign -d --entitlements - --xml "$b" 2>&1 || true; echo
            done >"$D/codesign-entitlements.txt"
          done
          grep -h "/actool " "$RUNNER_TEMP"/dumps/build-*.log >"$RUNNER_TEMP/dumps/xcode-actool-invocations.txt" || true

      - name: Icon sample (placeholder icon, compiled by actool)
        run: |
          S="$RUNNER_TEMP/icon-sample"; C="$S/Sample.xcassets"; O="$S/compiled"
          mkdir -p "$C/AppIcon.appiconset" "$O"
          printf '{"info":{"author":"xcode","version":1}}\n' >"$C/Contents.json"
          printf '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}\n' \
            >"$C/AppIcon.appiconset/Contents.json"
          python3 - "$C/AppIcon.appiconset/icon-1024.png" <<'PY'
          # Placeholder icon: a plain 1024x1024 RGB gradient, no alpha, no art, no text.
          import struct, sys, zlib
          n = 1024
          rows = b"".join(b"\0" + bytes(v for x in range(n) for v in (x // 4, y // 4, 128)) for y in range(n))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data))
          png = (b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", n, n, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(rows, 9)) + chunk(b"IEND", b""))
          open(sys.argv[1], "wb").write(png)
          PY
          cmd=(xcrun actool "$C" --compile "$O" --platform iphoneos --minimum-deployment-target 15.0
               --target-device iphone --target-device ipad --app-icon AppIcon
               --output-partial-info-plist "$O/partial-Info.plist"
               --output-format human-readable-text --notices --warnings --errors)
          printf '%q ' "${cmd[@]}" >"$S/actool-command.txt"; echo >>"$S/actool-command.txt"
          "${cmd[@]}" >"$S/actool-output.txt" 2>&1
          xcrun assetutil --info "$O/Assets.car" >"$S/assetutil-info.json"
          (cd "$O" && find . -type f -exec stat -f '%z %N' {} + | sort -k2) >"$S/compiled-files.txt"

      - name: Upload counter Runner.app
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcode-counter-app
          path: ${{ runner.temp }}/app-counter/
          include-hidden-files: true   # flutter_assets holds dotfiles (.last_build_id)
          retention-days: 7

      - name: Upload hooks_app Runner.app
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcode-hooks_app-app
          path: ${{ runner.temp }}/app-hooks_app/
          include-hidden-files: true
          retention-days: 7

      - name: Upload dumps and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcode-dumps
          path: ${{ runner.temp }}/dumps/
          retention-days: 7

      - name: Upload icon sample
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon-sample
          path: ${{ runner.temp }}/icon-sample/
          retention-days: 7
