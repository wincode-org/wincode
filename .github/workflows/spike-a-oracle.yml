name: spike-a-oracle

# Spike A oracle: build App.framework/App for the counter app with the OFFICIAL
# iOS gen_snapshot on macOS, using the exact flutter_tools iOS release steps,
# so the Linux-built gen_snapshot can be byte-compared against it.
# Manual only: gh workflow run spike-a-oracle.yml --ref <branch>

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    # macOS minutes are the scarce resource: this job never runs for a pull request, whoever opens it.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      FLUTTER_TAG: "3.47.7"
      CI: "true"
    steps:
      - name: Clone Flutter
        run: |
          git clone -q --depth 1 --branch "$FLUTTER_TAG" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Precache iOS artifacts
        run: |
          flutter --version --machine
          flutter precache --ios

      - name: Create counter app
        run: |
          cd "$RUNNER_TEMP"
          flutter create --project-name counter --org dev.wincode.spike counter
          cd counter && flutter pub get

      - name: Kernel (flutter_tools iOS release KernelSnapshot)
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/flutter/bin/cache"
          O="$RUNNER_TEMP/oracle"; mkdir -p "$O"
          cd "$RUNNER_TEMP/counter"
          cmd=("$C/dart-sdk/bin/dartaotruntime" "$C/dart-sdk/bin/snapshots/frontend_server_aot.dart.snapshot"
            --sdk-root "$C/artifacts/engine/common/flutter_patched_sdk_product/"
            --target=flutter --no-print-incremental-dependencies
            -Ddart.vm.profile=false -Ddart.vm.product=true
            --delete-tostring-package-uri=dart:ui --delete-tostring-package-uri=package:flutter
            --aot --tfa --target-os ios
            --packages "$RUNNER_TEMP/counter/.dart_tool/package_config.json"
            --output-dill "$O/app.dill" --depfile "$O/app.d" --verbosity=error
            package:counter/main.dart)
          printf '%q ' "${cmd[@]}" > "$O/kernel-command.txt"; echo >> "$O/kernel-command.txt"
          "${cmd[@]}"

      - name: gen_snapshot (official, flutter_tools iOS release AOTSnapshotter args)
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/oracle"
          GS="$RUNNER_TEMP/flutter/bin/cache/artifacts/engine/ios-release/gen_snapshot_arm64"
          cd "$O" && mkdir -p arm64/App.framework
          cmd=("$GS" --deterministic
            --snapshot_kind=app-aot-macho-dylib
            --macho=arm64/App.framework/App
            --macho-object=arm64/app.o
            --macho-min-os-version=15.0
            --macho-rpath=@executable_path/Frameworks,@loader_path/Frameworks
            --macho-install-name=@rpath/App.framework/App
            app.dill)
          printf '%q ' "${cmd[@]}" > gen-snapshot-command.txt; echo >> gen-snapshot-command.txt
          "${cmd[@]}"
          "$GS" --version > gen-snapshot-version.txt 2>&1 || true

      - name: Diagnostics (official gen_snapshot with a glibc-style stable qsort; x86_64 slice)
        run: |
          set -uo pipefail
          O="$RUNNER_TEMP/oracle"; D="$O/diag"; mkdir -p "$D"
          GS="$RUNNER_TEMP/flutter/bin/cache/artifacts/engine/ios-release/gen_snapshot_arm64"
          # Same merge sort as glibc's qsort (stable; left element wins ties), interposed into
          # the official binary to test whether qsort tie-breaking is the only host difference.
          cat > "$D/stable_qsort.c" <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          static unsigned long calls;
          static void msort(char *b, size_t n, size_t s, int (*c)(const void *, const void *), char *t) {
            if (n < 2) return;
            size_t h = n / 2;
            msort(b, h, s, c, t); msort(b + h * s, n - h, s, c, t);
            size_t i = 0, j = h, k = 0;
            while (i < h && j < n) {
              if (c(b + j * s, b + i * s) < 0) { memcpy(t + k * s, b + j * s, s); j++; }
              else { memcpy(t + k * s, b + i * s, s); i++; }
              k++;
            }
            while (i < h) { memcpy(t + k * s, b + i * s, s); i++; k++; }
            while (j < n) { memcpy(t + k * s, b + j * s, s); j++; k++; }
            memcpy(b, t, n * s);
          }
          static void stable_qsort(void *base, size_t n, size_t size, int (*cmp)(const void *, const void *)) {
            calls++;
            if (n < 2) return;
            char *tmp = malloc(n * size);
            msort(base, n, size, cmp, tmp);
            free(tmp);
          }
          __attribute__((destructor)) static void report(void) { fprintf(stderr, "stable_qsort: %lu calls\n", calls); }
          typedef struct { const void *replacement; const void *replacee; } interpose_t;
          __attribute__((used)) static const interpose_t interposers[]
              __attribute__((section("__DATA,__interpose"))) = {{(const void *)stable_qsort, (const void *)qsort}};
          C
          clang -O2 -dynamiclib -o "$D/stable_qsort.dylib" "$D/stable_qsort.c"
          # Thin, ad-hoc re-signed copy without hardened runtime so DYLD_INSERT_LIBRARIES applies.
          lipo -thin arm64 "$GS" -output "$D/gen_snapshot_arm64_thin"
          codesign -f -s - "$D/gen_snapshot_arm64_thin"
          run() { local name=$1; shift
            rm -rf "$D/$name"; mkdir -p "$D/$name/arm64/App.framework"; cp "$O/app.dill" "$D/$name/"
            ( cd "$D/$name" && "$@" --deterministic --snapshot_kind=app-aot-macho-dylib \
                --macho=arm64/App.framework/App --macho-object=arm64/app.o \
                --macho-min-os-version=15.0 \
                --macho-rpath=@executable_path/Frameworks,@loader_path/Frameworks \
                --macho-install-name=@rpath/App.framework/App app.dill ) > "$D/$name.log" 2>&1
            echo "$name exit=$?"; cat "$D/$name.log"; rm -f "$D/$name/app.dill"; }
          run official-again "$GS"
          run thin-plain "$D/gen_snapshot_arm64_thin"
          run thin-stable-qsort env DYLD_INSERT_LIBRARIES="$D/stable_qsort.dylib" "$D/gen_snapshot_arm64_thin"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then run x86_64-slice arch -x86_64 "$GS"; else echo "Rosetta not available: x86_64 slice skipped"; fi
          shasum -a 256 "$O/arm64/App.framework/App" "$D"/*/arm64/App.framework/App

      - name: Record environment and hashes
        run: |
          O="$RUNNER_TEMP/oracle"; cd "$O"
          { sw_vers; echo; xcodebuild -version; echo; uname -m
            echo; file "$RUNNER_TEMP/flutter/bin/cache/artifacts/engine/ios-release/gen_snapshot_arm64"
            echo; shasum -a 256 app.dill arm64/App.framework/App arm64/app.o
            echo; file arm64/App.framework/App
            echo; cat "$RUNNER_TEMP/flutter/bin/internal/engine.version"
          } > env.txt 2>&1
          cat env.txt

      - name: Upload oracle outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-a-oracle
          path: ${{ runner.temp }}/oracle/
          retention-days: 7
          if-no-files-found: error
