name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Signed-off-by on every commit
        env:
          # Passed via env, not interpolated into the script (branch names are attacker-controlled).
          BASE_REF: ${{ github.base_ref }}
          # The pull request's author as GitHub verified it. A commit's author name and email are set by whoever makes the commit.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -u
          bad=""
          for sha in $(git rev-list --no-merges "origin/${BASE_REF}..HEAD"); do
            # Exempt: release-please's commits, which the Actions bot makes. Both must hold: the exact bot email on the commit
            # and a pull request that is the bot's. A name that ends in [bot] proves nothing, and neither does an email alone.
            if [ "$PR_AUTHOR" = "github-actions[bot]" ] &&
               [ "$(git log -1 --format=%ae "$sha")" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
              continue
            fi
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+>$'; then
              bad="${bad}$(git log -1 --format='  %h %s' "$sha")"$'\n'
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::DCO check failed: these commits have no Signed-off-by line:"
            printf '%s' "$bad"
            cat <<EOF

          Fix: sign off your commits (https://developercertificate.org/).
            Last commit only:   git commit --amend -s --no-edit
            Several commits:    git rebase --signoff origin/${BASE_REF}
          Then force-push:      git push --force-with-lease
          EOF
            exit 1
          fi
          echo "All commits are signed off."
