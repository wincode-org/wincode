name: dart

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: format, analyze, test (wincode_core)
    runs-on: ubuntu-latest
    steps:
      # A short path: Dart's test compiler cannot start from a very long one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wc
          persist-credentials: false
      # packages/wincode_core pins a range (^3.13.0), so this is the version the package was developed with.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.4
      - name: pub get
        working-directory: wc/packages/wincode_core
        run: dart pub get
      - name: dart format
        working-directory: wc/packages/wincode_core
        run: dart format --output=none --set-exit-if-changed .
      - name: dart analyze
        working-directory: wc/packages/wincode_core
        run: dart analyze --fatal-infos
      - name: dart test
        working-directory: wc/packages/wincode_core
        run: dart test
