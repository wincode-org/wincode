name: dart

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    # The Linux jobs keep the names that branch protection requires; the Windows job adds ', windows'.
    name: format, analyze, test (${{ matrix.package }}${{ matrix.os == 'windows-latest' && ', windows' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: [wincode_core, wincode_asc, wincode_cli]
        os: [ubuntu-latest]
        # ADR-0013, section 8: paths and process calls differ on Windows, where users run the CLI.
        include:
          - package: wincode_cli
            os: windows-latest
    steps:
      # A short path: Dart's test compiler cannot start from a very long one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wc
          persist-credentials: false
      # The packages pin a range (^3.13.0), so this is the version they were developed with.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.4
      - name: pub get
        working-directory: wc/packages/${{ matrix.package }}
        run: dart pub get
      - name: dart format
        working-directory: wc/packages/${{ matrix.package }}
        run: dart format --output=none --set-exit-if-changed .
      - name: dart analyze
        working-directory: wc/packages/${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: dart test
        working-directory: wc/packages/${{ matrix.package }}
        run: dart test
      # ADR-0013: a compiled wincode writes the reference workflow with no source tree around it. The executable and a
      # generated fixture project live next to the checkout, not in it.
      - name: compiled wincode init --workflow
        if: matrix.package == 'wincode_cli' && matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compiled fixture/ios
          dart compile exe wc/packages/wincode_cli/bin/wincode.dart -o compiled/wincode.exe
          echo "name: fixture" > fixture/pubspec.yaml
          cd fixture
          ../compiled/wincode.exe init --workflow --dry-run --yes --bundle-id com.example.app --team-id TEAM000000 | tee ../dry-run.txt
          grep -F "It would copy the reference workflow to .github/workflows/wincode-ios.yml." ../dry-run.txt
          test ! -e .github
          test ! -e wincode.yaml
          ../compiled/wincode.exe init --workflow --yes --bundle-id com.example.app --team-id TEAM000000
          cmp .github/workflows/wincode-ios.yml ../wc/packages/wincode_cli/templates/wincode-ios.yml

  actionlint:
    # ADR-0015, sections 8 and 13: the reference workflow that wincode init --workflow writes passes actionlint, which
    # also runs the shellcheck of the runner on its run: scripts. Only the template is linted. The release is pinned
    # with its SHA-256, as the zsign job pins its source.
    name: actionlint (the reference workflow)
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the pinned actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
      - name: lint the reference workflow
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color packages/wincode_cli/templates/wincode-ios.yml'

  zsign:
    # ADR-0013, phase 3a and section 11: the zsign that winCode pins signs a generated app with a throwaway certificate,
    # through the same code as a Linux server runs. wincode doctor --sign --build-zsign downloads the pinned source
    # archive, checks its SHA-256 and builds it (phase 3a.1) and records the binary, wincode sign starts it directly and
    # signs, and wincode sign --verify-only reads the result back. Nothing here is Apple's.
    name: zsign integration
    runs-on: ubuntu-latest
    env:
      # packages/wincode_cli/lib/src/zsign.dart pins this, and test/sign_test.dart checks that the two agree. The SHA-256
      # of the archive is pinned there only: doctor --sign --build-zsign checks it, so this job does not.
      ZSIGN_COMMIT: f6158be9e62a5ce2a53d72b1a6d880880da956c8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wc
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.4
      # The tools that the build needs, installed here by hand: wincode never installs them (it stops and says what to
      # run). The binary is built by wincode itself, into zsign/zsign-<commit>/bin/zsign under $XDG_DATA_HOME/wincode
      # (nativeZsignPath in lib/src/zsign_native.dart), in the step below.
      - name: install the tools that build zsign
        run: |
          set -euo pipefail
          echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          sudo apt-get update -q
          sudo apt-get install -y -q make g++ pkg-config libssl-dev
      # The flow of a Linux server, with a throwaway identity: a PEM key and a certificate from the profile, as in a
      # real run. zsign finds the Apple intermediate that issued the certificate by the hash of the issuer's name, and
      # a PEM key leaves it no other chain. So the throwaway CA is given the name of one of those intermediates (G3),
      # and the certificate then gets zsign's embedded one, which nothing here verifies against. The CA's key is made
      # here, is Apple's in no way, and nothing trusts it.
      - name: sign a generated app with wincode sign, then check it with sign --verify-only and upload --dry-run
        working-directory: wc/packages/wincode_cli
        run: |
          set -euo pipefail
          dart pub get
          w="$RUNNER_TEMP/work"
          mkdir -p "$w"
          (
            cd "$w"
            openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 90 \
              -subj "/CN=Apple Worldwide Developer Relations Certification Authority/OU=G3/O=Apple Inc./C=US"
            openssl req -newkey rsa:2048 -nodes -keyout dist.key -out leaf.csr \
              -subj "/CN=Apple Distribution: Example (TEAM000000)/OU=TEAM000000/O=Example"
            openssl x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out leaf.pem -days 90
            openssl x509 -in leaf.pem -outform DER -out leaf.der
            # 9b16b75c is the issuer hash that zsign's embedded G3 intermediate answers to.
            test "$(openssl x509 -in leaf.pem -noout -issuer_hash)" = 9b16b75c
          )
          # The keys are closed to other users, as wincode requires on Linux (ADR-0013, section 11).
          chmod 600 "$w/dist.key"
          dart run tool/zsign_fixture.dart "$w/fixture" "$w/leaf.der"
          openssl cms -sign -binary -nodetach -outform DER -in "$w/fixture/profile.plist" -signer "$w/ca.pem" \
            -inkey "$w/ca.key" -out "$w/fixture/profile.mobileprovision"
          # doctor reads the App Store Connect key folder by name only: a placeholder in a folder closed to others.
          mkdir -m 700 "$w/asc"
          echo placeholder > "$w/asc/AuthKey_ABCDE12345.p8"
          echo 00000000-0000-4000-8000-000000000001 > "$w/asc/issuer-id"
          chmod 600 "$w/asc/AuthKey_ABCDE12345.p8"
          export WINCODE_DIST_KEY="$w/dist.key"
          cfg="$w/fixture/wincode.yaml"

          # The real download and build (phase 3a.1): wincode fetches the pinned source archive, checks its SHA-256 before it
          # unpacks it, builds it with make, checks the version, and records the SHA-256 of the binary it built. wincode
          # sign runs only that one.
          WINCODE_ASC_KEY_DIR="$w/asc" dart run bin/wincode.dart doctor --sign --build-zsign --config "$cfg" | tee "$w/doctor.txt"
          grep -F "is the pinned one" "$w/doctor.txt"
          grep -F "PASS  the zsign that was built prints version: 1.9.0" "$w/doctor.txt"
          grep -F "is recorded in" "$w/doctor.txt"
          # A second run finds the binary that it built, and does nothing.
          WINCODE_ASC_KEY_DIR="$w/asc" dart run bin/wincode.dart doctor --sign --build-zsign --config "$cfg" | tee "$w/doctor2.txt"
          grep -F "nothing to do" "$w/doctor2.txt"
          # What it leaves is the finished tree: no build folder, no archive.
          test "$(ls -A "$XDG_DATA_HOME/wincode/zsign")" = "zsign-$ZSIGN_COMMIT"
          # A binary that is not the recorded one is not run.
          zsign="$XDG_DATA_HOME/wincode/zsign/zsign-$ZSIGN_COMMIT/bin/zsign"
          cp "$zsign" "$w/zsign.good"
          echo changed >> "$zsign"
          if dart run bin/wincode.dart sign --offline --json --config "$cfg" "$w/fixture/unsigned.ipa" > "$w/changed.json"; then
            echo "a changed zsign was run"
            exit 1
          fi
          grep -F '"id":"zsign-changed"' "$w/changed.json"
          cp "$w/zsign.good" "$zsign"
          # A key that other users can read is refused (78) before anything is signed.
          chmod 644 "$w/dist.key"
          code=0
          dart run bin/wincode.dart sign --offline --json --config "$cfg" "$w/fixture/unsigned.ipa" > "$w/open.json" || code=$?
          test "$code" -eq 78
          grep -F '"id":"keys-permissions"' "$w/open.json"
          chmod 600 "$w/dist.key"

          # The real thing: wincode sign starts the pinned zsign itself, with the PEM key and the certificate of the
          # profile, and checks every signature that zsign wrote. --offline keeps it from asking App Store Connect.
          dart run bin/wincode.dart sign --offline --config "$cfg" "$w/fixture/unsigned.ipa" | tee "$w/sign.txt"
          grep -F "on this machine, with the SHA-256 that doctor recorded" "$w/sign.txt"
          grep -F "every signature checks out" "$w/sign.txt"
          # Only signed.ipa is left in the output folder: the temporary folder is gone.
          test "$(ls -A "$w/fixture/build")" = signed.ipa
          # --verify-only reads no private key, and --offline keeps it from asking App Store Connect.
          rm "$w/dist.key"
          dart run bin/wincode.dart sign --verify-only --offline --config "$cfg"
          # wincode upload runs on Linux too. With --dry-run it checks the IPA that zsign signed, prints the plan and the
          # requests, and sends nothing; it needs no App Store Connect key for that.
          dart run bin/wincode.dart upload --dry-run --config "$cfg" | tee "$w/upload-dry-run.txt"
          grep -F "Upload plan (nothing is sent):" "$w/upload-dry-run.txt"
          grep -F "POST https://api.appstoreconnect.apple.com/v1/buildUploads" "$w/upload-dry-run.txt"
          # An IPA that is not signed is refused.
          if dart run bin/wincode.dart upload --dry-run --ipa "$w/fixture/unsigned.ipa" --config "$cfg"; then
            echo "an unsigned IPA passed the check of upload"
            exit 1
          fi
          # A file changed after signing must fail the check, and upload refuses that IPA too.
          mkdir -p "$w/changed/Payload/Example.app/assets"
          echo changed > "$w/changed/Payload/Example.app/assets/hello.txt"
          (cd "$w/changed" && zip -q "$w/fixture/build/signed.ipa" Payload/Example.app/assets/hello.txt)
          if dart run bin/wincode.dart sign --verify-only --offline --config "$cfg"; then
            echo "a changed IPA passed the check"
            exit 1
          fi
          if dart run bin/wincode.dart upload --dry-run --config "$cfg"; then
            echo "a changed IPA passed the check of upload"
            exit 1
          fi
